[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hemfm-v4"
version = "0.1.0"
description = "Fail-closed local execution system for the HEM-FM v4.0 protocol"
requires-python = ">=3.12"
dependencies = [
  "av>=14,<17",
  "kagglehub>=1.0,<2",
  "huggingface_hub>=0.28,<2",
  "numpy>=2.0,<3",
  "nibabel>=5.4,<6",
  "pandas>=2.2,<3",
  "PyYAML>=6.0,<7",
  "pydicom>=2.4,<4",
  "scikit-learn>=1.5,<2",
  "scipy>=1.14,<2",
  "psutil>=6,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
train = [
  "einops>=0.8,<1",
  "timm>=1.0,<2",
  "transformers>=4.48,<6",
  "peft>=0.14,<1",
  "tensorboard>=2.18,<3",
]

[project.scripts]
hemfm = "hemfm.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

